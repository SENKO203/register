<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .login-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: 100%; max-width: 340px; text-align: center; }
  .login-logo { font-size: 40px; margin-bottom: 8px; }
  .login-title { font-weight: 900; font-size: 22px; margin-bottom: 24px;
    background: linear-gradient(90deg, var(--gold), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .login-input { width: 100%; background: var(--surface); border: 1px solid #26262f; color: var(--text);
    padding: 14px; border-radius: 10px; font-family: inherit; font-size: 15px; margin-bottom: 12px; text-align: center; }
  .login-error { color: var(--accent); font-size: 13px; min-height: 18px; margin-bottom: 12px; }
  .login-hint { color: var(--text-muted); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">📖</div>
    <h1 class="login-title">『 القـارئ 』</h1>
    <form id="login-form">
      <input type="password" id="password" class="login-input" placeholder="كلمة المرور" autofocus required>
      <p class="login-error" id="login-error"></p>
      <button type="submit" class="btn btn-primary" style="width:100%">دخول</button>
    </form>
    <p class="login-hint" id="login-hint"></p>
  </div>
</div>
<script>
  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('login-error');
  const hintEl = document.getElementById('login-hint');

  // نتحقق إذا هذا أول تشغيل (ما فيه كلمة مرور معيّنة بعد)
  fetch('/api/library').then(r => {
    if (r.status !== 401) {
      // ما فيه حماية مفعّلة بعد أصلًا — نعرض تلميح
      hintEl.textContent = 'أول مرة تفتح الموقع؟ اكتب أي كلمة مرور جديدة الآن لتفعيل الحماية.';
    }
  }).catch(() => {});

  form.onsubmit = async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    const password = document.getElementById('password').value;
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const data = await res.json();
    if (!res.ok) { errorEl.textContent = data.error || 'خطأ'; return; }
    location.href = '/';
  };
</script>
</body>
</html>
